[package]
name = "bump-version"
# Kept in sync with the VERSION file (the embedded source of truth).
version = "2.1.1"
edition = "2024"

[dependencies]
# JSON handling is delegated to serde's JSON implementation; nothing else
# needs a third-party crate.
serde_json = "1.0"

# The binary builds release artifacts for several targets; the script that
# drives that lives next to this crate in scripts/.
[workspace]
members = ["scripts"]

# Produce compact binaries, like the -ldflags="-s -w" builds did.
[profile.release]
strip = true
